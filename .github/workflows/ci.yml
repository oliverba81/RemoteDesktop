name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    name: Build, test, package (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore RemoteDesktop.sln

      # The official SDK ships the Windows Desktop targeting pack, so
      # EnableWindowsTargeting builds the WinForms Host/Viewer on Linux too.
      - name: Build solution
        run: dotnet build RemoteDesktop.sln -c Release --no-restore

      - name: Test (Shared + Relay)
        run: dotnet test tests/RemoteDesktop.Shared.Tests/RemoteDesktop.Shared.Tests.csproj -c Release --no-build

      - name: Publish Windows clients (win-x64, self-contained)
        run: |
          dotnet publish src/RemoteDesktop.Host/RemoteDesktop.Host.csproj -c Release -r win-x64 \
            --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -o dist/clients/host
          dotnet publish src/RemoteDesktop.Viewer/RemoteDesktop.Viewer.csproj -c Release -r win-x64 \
            --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -o dist/clients/viewer

      # DSM expects a numeric revision after the dash (e.g. 1.0.0-0006).
      - name: Build Synology .spk
        run: bash packaging/synology/build-spk.sh "1.0.0-$(printf '%04d' ${{ github.run_number }})"

      - name: Upload relay .spk
        uses: actions/upload-artifact@v4
        with:
          name: RemoteDesktopRelay-spk
          path: dist/*.spk

      - name: Upload Windows clients
        uses: actions/upload-artifact@v4
        with:
          name: RemoteDesktop-windows-clients
          path: dist/clients/**
