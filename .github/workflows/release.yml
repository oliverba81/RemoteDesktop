name: Release

# Publishes a GitHub Release with the Windows app and the Synology .spk — the
# download page served by the NAS package links to releases/latest, and the app's
# auto-updater reads the latest release. Trigger either by pushing a v* tag, or
# manually from the Actions tab / API (workflow_dispatch) with a version number.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.3.0 (with or without the leading v)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # REL_VERSION is the DSM package version (x.y.z-rev); REL_TAG is the vX.Y.Z
      # release tag. NOT named VERSION/TAG: MSBuild treats a "Version" environment
      # variable as the Version property (case-insensitively), which poisons every
      # dotnet command with an invalid assembly version.
      - name: Compute version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          RAW="${RAW#v}"
          REL_VERSION="$RAW"
          [[ "$REL_VERSION" == *-* ]] || REL_VERSION="$REL_VERSION-0001"
          echo "REL_VERSION=$REL_VERSION" >> "$GITHUB_ENV"
          echo "REL_TAG=v${RAW%%-*}" >> "$GITHUB_ENV"

      - name: Test (Shared + Relay)
        run: dotnet test tests/RemoteDesktop.Shared.Tests/RemoteDesktop.Shared.Tests.csproj -c Release

      - name: Publish Windows app (win-x64, self-contained)
        run: |
          VNUM="${REL_VERSION%%-*}"
          dotnet publish src/RemoteDesktop.App/RemoteDesktop.App.csproj -c Release -r win-x64 \
            --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version="$VNUM" \
            -o dist/clients/app
          (cd dist/clients/app && zip -r ../../RemoteDesktop-win-x64.zip .)

      - name: Build Synology .spk
        run: bash packaging/synology/build-spk.sh "$REL_VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Explicit tag so a manual dispatch (which has no triggering tag) still
          # creates the vX.Y.Z tag and release.
          tag_name: ${{ env.REL_TAG }}
          name: ${{ env.REL_TAG }}
          generate_release_notes: true
          files: |
            dist/RemoteDesktop-win-x64.zip
            dist/*.spk
